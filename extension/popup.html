<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Music Controls</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 240px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #1e1f22;
            color: #dcddde;
            padding: 10px;
        }

        .header {
            font-size: 10px;
            font-weight: 700;
            color: #72767d;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            padding: 2px 2px 8px;
        }

        .service {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 6px;
            background: #2b2d31;
            margin-bottom: 4px;
        }
        .service:last-child { margin-bottom: 0; }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4f545c;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .info { flex: 1; min-width: 0; }

        .name {
            font-size: 13px;
            font-weight: 600;
            color: #e3e5e8;
            line-height: 1.3;
        }

        .track {
            font-size: 11px;
            color: #72767d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
            line-height: 1.3;
        }

        /* Brand colors activate when connected */
        .service.connected-ytm .dot   { background: #ff0033; }
        .service.connected-sc  .dot   { background: #ff5500; }
        .service.connected-ytm .track,
        .service.connected-sc  .track { color: #b5b9be; }
    </style>
</head>
<body>
    <div class="header">Music Controls</div>

    <div class="service" id="ytm-row">
        <div class="dot"></div>
        <div class="info">
            <div class="name">YouTube Music</div>
            <div class="track" id="ytm-track">Not connected</div>
        </div>
    </div>

    <div class="service" id="sc-row">
        <div class="dot"></div>
        <div class="info">
            <div class="name">SoundCloud</div>
            <div class="track" id="sc-track">Not connected</div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
